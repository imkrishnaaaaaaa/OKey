name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Extension bundle sanity (manifest + unlock page shipped)
        run: |
          test -f dist/extension/manifest.json
          test -f dist/extension/unlock/unlock.html
          test -f dist/pwa/sw.js
      - run: npm audit --omit=dev --audit-level=critical
        continue-on-error: true # triage findings; don't block on advisory noise
