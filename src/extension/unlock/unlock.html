<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Extension page embedded as a cross-origin iframe by content scripts.
       Page JS cannot read this document — master PIN entry never touches
       page-owned DOM (revamp H4). -->
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', system-ui, sans-serif; }
    body {
      background: #f5f5f7;
      color: #1c1c1e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 100vh;
      padding: 12px;
    }
    .brand { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 13px; color: #55555c; letter-spacing: .02em; }
    .brand svg { width: 15px; height: 15px; color: #7b68ee; }
    #pin {
      width: 100%;
      max-width: 180px;
      padding: 9px 12px;
      background: #ffffff;
      border: 2px solid transparent;
      border-radius: 16px;
      box-shadow: 0 1px 3px rgba(28,28,46,.05), 0 4px 14px rgba(28,28,46,.04);
      color: #1c1c1e;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .5em;
      text-align: center;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    #pin:focus { border-color: #7b68ee; box-shadow: 0 0 0 4px rgba(123,104,238,.14); }
    #pin.shake { animation: shake .3s; }
    @keyframes shake {
      20% { transform: translateX(-5px); } 40% { transform: translateX(5px); }
      60% { transform: translateX(-3px); } 80% { transform: translateX(3px); }
    }
    #err { min-height: 14px; font-size: 11px; font-weight: 700; color: #ef5e73; text-align: center; }
    button {
      padding: 9px 22px;
      border: none;
      border-radius: 999px;
      background: #7b68ee;
      color: white;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(123,104,238,.28);
      transition: transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .2s, background .2s;
    }
    button:hover:not(:disabled) { background: #8676f0; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(123,104,238,.35); }
    button:active:not(:disabled) { transform: scale(.96); }
    button:disabled { opacity: .45; cursor: default; }
  </style>
</head>
<body>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none"><path d="M8.3 10.6V7.2a3.7 3.7 0 0 1 7.4 0v3.4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="12" cy="15.4" r="5.6" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="14.4" r="1.2" fill="currentColor"/><rect x="11.4" y="14.8" width="1.2" height="3" rx=".6" fill="currentColor"/></svg>
    OKey is locked
  </div>
  <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4"
         placeholder="••••" autocomplete="off" />
  <div id="err"></div>
  <button id="go">Unlock</button>
  <script src="unlock.js"></script>
</body>
</html>
